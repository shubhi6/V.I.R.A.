<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veera - Your AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Vira</h1>
            <p>Your Personal AI Assistant</p>
        </div>
        
        <div class="assistant-container">
            <div class="assistant-avatar" id="avatar">
                <div class="avatar-circle">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="pulse-ring"></div>
            </div>
            
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot-message">
                        <div class="message-content">
                            Hello! I'm Vira, your AI assistant. How can I help you today?
                        </div>
                    </div>
                </div>
                
                <div class="input-container">
                    <input type="text" id="userInput" placeholder="Ask Veera anything..." autocomplete="off">
                    <button id="voiceButton"><i class="fas fa-microphone"></i></button>
                    <button id="sendButton"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
        
        <div class="status" id="status">
            <i class="fas fa-circle" id="statusIcon"></i>
            <span id="statusText">Vira is ready</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
